<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canavezi - Peça Agora</title>
    <link rel="preload" as="image" href="assets/garlic-bread-bg-fast.jpg" fetchpriority="high" />
    <style>
      :root {
        --orange: #f45112;
        --whatsapp: #25d366;
        --yellow: #ffdd21;
        --ifood: #e50008;
        --ink: #111111;
        --paper: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #130d09;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        color: var(--paper);
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.24)),
          url("assets/garlic-bread-bg-fast.jpg") center / cover;
      }

      .page {
        width: min(100%, 540px);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(18px, 4vw, 28px) clamp(18px, 5vw, 30px) 32px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: clamp(18px, 4vh, 30px);
        background: rgba(0, 0, 0, 0.08);
      }

      .hero-title {
        margin: -8px 0 2px;
        font-size: clamp(2rem, 8vw, 3.35rem);
        font-weight: 300;
        line-height: 0.95;
        text-align: center;
        letter-spacing: 0;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
      }

      .buttons {
        display: grid;
        gap: clamp(18px, 3.3vh, 26px);
        margin-top: clamp(8px, 2vh, 16px);
        margin-bottom: auto;
      }

      .order-button {
        position: relative;
        min-height: clamp(86px, 14vh, 118px);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 18px 26px;
        border-radius: 999px;
        color: var(--paper);
        text-align: center;
        text-decoration: none;
        font-size: clamp(1.14rem, 4.5vw, 1.48rem);
        font-weight: 400;
        line-height: 1.45;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.17);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          filter 0.18s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .order-button:hover,
      .order-button:focus-visible {
        transform: translateY(-2px);
        filter: brightness(1.04);
        box-shadow: 0 16px 26px rgba(0, 0, 0, 0.24);
        outline: none;
      }

      .order-button:active {
        transform: translateY(0);
      }

      .button-text {
        display: block;
        max-width: 22ch;
      }

      .with-seal {
        padding-left: 86px;
        padding-right: 42px;
      }

      .brand-logo {
        position: absolute;
        left: 20px;
        top: 50%;
        width: clamp(50px, 13vw, 62px);
        height: clamp(50px, 13vw, 62px);
        transform: translateY(-50%);
        overflow: hidden;
        border-radius: 50%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.24);
      }

      .brand-logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .icon {
        flex: 0 0 auto;
        font-size: clamp(1.35rem, 5vw, 1.65rem);
        line-height: 1;
      }

      .orange {
        background: var(--orange);
      }

      .whatsapp {
        background: var(--whatsapp);
      }

      .yellow {
        background: var(--yellow);
        color: var(--ink);
      }

      .red {
        background: var(--ifood);
      }

      @media (max-width: 390px) {
        .page {
          padding-inline: 14px;
        }

        .order-button {
          min-height: 82px;
          padding-inline: 20px;
        }

        .with-seal {
          padding-left: 76px;
          padding-right: 24px;
        }

        .brand-logo {
          left: 16px;
        }
      }

      @media (min-width: 760px) {
        body {
          background-size: min(100vw, 760px) auto;
        }

        .page {
          box-shadow: 0 0 70px rgba(0, 0, 0, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Opções de pedido Canavezi">
      <h1 class="hero-title">Canavezi Gastrobar</h1>

      <nav class="buttons" aria-label="Escolha onde pedir">
        <a
          class="order-button whatsapp with-seal"
          data-to="wpp-alho"
          href="#"
          target="_blank"
          rel="noopener"
        >
          <span class="brand-logo" aria-hidden="true">
            <img src="src/logocardwhats-small.jpg" alt="" width="180" height="180" decoding="async" />
          </span>
          <span class="icon" aria-hidden="true">📱</span>
          <span class="button-text">Peça pelo WhatsApp</span>
        </a>

        <a class="order-button yellow" data-to="99-lanche" href="#" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">🏍️</span>
          <span class="button-text">Peça pela 99Food!<br />LANCHE GOURMET</span>
        </a>

        <a class="order-button red" data-to="ifood-lanche" href="#" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">🛍️</span>
          <span class="button-text">Peça pelo iFood! LANCHE GOURMET</span>
        </a>
      </nav>
    </main>

    <script>
      const links = {
        wpp: "https://wa.me/5512992564125?text=Ol%C3%A1%2C%20quero%20fazer%20um%20pedido",
        ifood: "https://www.ifood.com.br/delivery/taubate-sp/canavezi-gastrobar-quiririm/06a27ae6-be54-4144-9132-756f8027a189?UTM_Medium=share",
        99: "https://oia.99app.com/dlp9/5JsDN1?share_media=WHATSAPP",
        "wpp-alho": "https://wa.me/5512992564125?text=Ol%C3%A1%2C%20quero%20fazer%20um%20pedido",
        "99-lanche": "https://oia.99app.com/dlp9/5JsDN1?share_media=WHATSAPP",
        "ifood-lanche": "https://www.ifood.com.br/delivery/taubate-sp/canavezi-gastrobar-quiririm/06a27ae6-be54-4144-9132-756f8027a189?UTM_Medium=share",
      };

      document.querySelectorAll("[data-to]").forEach((button) => {
        const target = button.dataset.to;
        button.href = links[target] || "#";
      });

      const aliases = {
        wpp: "wpp-alho",
        whatsapp: "wpp-alho",
        alho: "wpp-alho",
        ifood: "ifood-lanche",
        99: "99-lanche",
        food99: "99-lanche",
      };

      const params = new URLSearchParams(window.location.search);
      const requestedTarget = params.get("to");
      const redirectTarget = aliases[requestedTarget] || requestedTarget;

      if (redirectTarget && links[redirectTarget]) {
        window.location.replace(links[redirectTarget]);
      }
    </script>
  </body>
</html>
